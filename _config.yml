title: trip/wire
description: Research notebook on sensor-network models for detecting and locating drones cheaply
baseurl: "/tripwire"
url: "https://paulrenzi.github.io"
remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

color_scheme: umbrella
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Repository":
    - "https://github.com/paulrenzi/tripwire"

footer_content: "Research notes compiled from public sources. Ratings are working judgements, not test results. Last full review 2026-10-23."

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Unverified
    color: yellow
  important:
    title: Key point
    color: green

exclude:
  - README.md
  - docs/
  - worker/
  - models/_template.md
