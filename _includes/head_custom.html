<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;700&display=swap">
<script>
/* Fold-out sections: open the one holding a linked anchor, and the open/close-all button. */
(function () {
  function reveal(hash) {
    if (!hash || hash.length < 2) return;
    var el;
    try { el = document.getElementById(decodeURIComponent(hash.slice(1))); } catch (e) { return; }
    if (!el) return;
    var opened = false;
    for (var d = el.closest('details'); d; d = d.parentElement && d.parentElement.closest('details')) {
      if (!d.open) { d.open = true; opened = true; }
    }
    if (opened) el.scrollIntoView();
  }
  document.addEventListener('DOMContentLoaded', function () {
    reveal(location.hash);
    document.querySelectorAll('[data-layers-toggle]').forEach(function (b) {
      b.addEventListener('click', function () {
        var ds = document.querySelectorAll('details.layer');
        var open = Array.prototype.some.call(ds, function (d) { return !d.open; });
        ds.forEach(function (d) { d.open = open; });
        b.textContent = open ? 'Close all sections' : 'Open all sections';
      });
    });
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href^="#"]');
      if (a) setTimeout(function () { reveal(a.getAttribute('href')); }, 0);
    });
  });
  window.addEventListener('hashchange', function () { reveal(location.hash); });
})();
</script>
